name: payment-flow-benchmark

x-podman:
  in_pod: false

x-application: &application
  build: .
  image: payment-flow-benchmark-app

services:
  database:
    image: docker.io/library/postgres:17.6
    environment:
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: checkout
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d checkout]
      interval: 1s
      timeout: 5s
      retries: 60

  api:
    <<: *application
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        npm run migrate
        exec npm run dev
    environment:
      DATABASE_URL: postgresql://postgres:benchmark@database:5432/checkout
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    volumes:
      - ./node_modules:/app/node_modules
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./openapi.json:/app/openapi.json:ro
    depends_on:
      database:
        condition: service_healthy

  test-database:
    image: docker.io/library/postgres:17.6
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: checkout_test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d checkout_test]
      interval: 1s
      timeout: 5s
      retries: 60

  tests:
    <<: *application
    profiles: [test]
    command: [npm, test]
    environment:
      DATABASE_URL: postgresql://postgres:benchmark@test-database:5432/checkout_test
    depends_on:
      test-database:
        condition: service_healthy

  tooling:
    <<: *application
    profiles: [tools]
    command: [npm, run, 'format:check']
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules

volumes:
  database-data:
