name: payment-flow-benchmark

x-podman:
  in_pod: false

x-application: &application
  build:
    context: .
    target: application
  image: payment-flow-benchmark-app

services:
  database:
    image: docker.io/library/postgres:17.6
    environment:
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: checkout
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d checkout]
      interval: 1s
      timeout: 5s
      retries: 60

  api:
    <<: *application
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        until node -e "const client = new (require('pg').Client)({ connectionString: process.env.DATABASE_URL }); client.connect().then(() => client.end(), () => process.exit(1))"; do sleep 1; done
        npm run migrate
        exec npm run dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:benchmark@database:5432/checkout
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    volumes:
      - ./node_modules:/app/node_modules
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
      - ./openapi.json:/app/openapi.json:ro
    depends_on:
      - database

  test-database:
    image: docker.io/library/postgres:17.6
    profiles: [test]
    environment:
      POSTGRES_PASSWORD: benchmark
      POSTGRES_DB: checkout_test
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d checkout_test]
      interval: 1s
      timeout: 5s
      retries: 60

  tests:
    <<: *application
    profiles: [test]
    command: [npm, test]
    environment:
      DATABASE_URL: postgresql://postgres:benchmark@test-database:5432/checkout_test
      RATE_LIMIT_MAX: 10000
    depends_on:
      test-database:
        condition: service_healthy

  mutation:
    <<: *application
    build:
      context: .
      target: mutation
    image: payment-flow-benchmark-mutation
    profiles: [test]
    command: [npx, stryker, run]
    environment:
      DATABASE_URL: postgresql://postgres:benchmark@test-database:5432/checkout_test
      RATE_LIMIT_MAX: 10000
      NODE_OPTIONS: --unhandled-rejections=warn
    volumes:
      - ./reports:/app/reports
    depends_on:
      test-database:
        condition: service_healthy

  tooling:
    <<: *application
    profiles: [tools]
    command: [npm, run, 'format:check']
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules

volumes:
  database-data:
